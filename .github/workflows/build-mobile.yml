name: Build PureTube Standalone Mobile Apps (APK & IPA)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Sync Web Assets & Install Capacitor
        working-directory: mobile
        run: |
          python3 sync_web.py
          npm install --no-audit --no-fund
          [ -d android ] || npx cap add android
          npx cap sync android
          python3 setup_mobile.py

      - name: Build Debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload PureTube Android APK
        uses: actions/upload-artifact@v7
        with:
          name: PureTube-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  build-ios-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Sync Web Assets & Install Capacitor
        working-directory: mobile
        run: |
          python3 sync_web.py
          npm install --no-audit --no-fund
          [ -d ios ] || npx cap add ios
          npx cap sync ios
          python3 setup_mobile.py

      - name: Install CocoaPods Dependencies
        working-directory: mobile/ios/App
        run: pod install

      - name: Build Unsigned PureTube.ipa
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="$PWD/build" \
            build
          mkdir -p Payload
          cp -r build/Release-iphoneos/App.app Payload/PureTube.app
          zip -qry PureTube-Unsigned.ipa Payload

      - name: Upload PureTube iOS IPA
        uses: actions/upload-artifact@v7
        with:
          name: PureTube-iOS-Unsigned-IPA
          path: mobile/ios/App/PureTube-Unsigned.ipa
